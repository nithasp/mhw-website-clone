<section id="mhw-media">
  <div class="mhw-title flex-center" appAnimate>
    <h1>Media</h1>
  </div>
  <div class="wrapper wrapper-slider" appAnimate>
    <swiper [config]="mhwMediaConfig">
      <ng-template swiperSlide *ngFor="let item of mediaList">
        <h1>{{ item.text }}</h1>
        <a [href]="item.url" target="_blank" rel="noopener" class="wrapper-image mhw-card">
          <img [src]="item.thumbnail" alt="" />
        </a>
      </ng-template>
    </swiper>
    <div class="wrapper-swiper-navigation">
      <div class="prev-icon-mhw-media"></div>
      <div class="next-icon-mhw-media"></div>
    </div>
    <div class="wrapper-pagination-mhw-media"></div>
  </div>
  <div class="mhw-button flex-center wrapper-mhw-button" appAnimate="fade">
    <a routerLink="/media" class="mhw-card mhw-media-button">
      <span>List</span>
    </a>
  </div>
</section>
