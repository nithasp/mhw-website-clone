<div class="lower lower--ecosystem">
  <app-page-hero
    title="Ecosystem"
    role="A New Locale"
    name="Hoarfrost Reach"
    description="A cold, inhospitable region, covered in snow and ice.<br>It may look inhospitable, but it's teeming with unique endemic life."
    bg="/assets/images/ecosystem/main_bg.jpg"
    bgSp="/assets/images/ecosystem/main_bg_sp.jpg"
    movie="/assets/video/ecosystem_mhw.mp4"
  ></app-page-hero>

  <section class="content">
    <header class="content__header" appAnimate>
      <h1 class="content__header__title">A Region Covered in Snow</h1>
    </header>
    <div class="content__body">
      <article class="article">
        <figure class="article__figure">
          <img src="/assets/images/ecosystem/img_01_01.jpg" alt="" appAnimate />
          <figcaption class="article__figure__text textbox" appAnimate>
            <p appTypeText>
              Hoarfrost Reach has a variety of different areas.<br />As you continue your investigations, you'll
              uncover more parts of the map, eventually culminating in the largest locale in Monster Hunter: World!
            </p>
          </figcaption>
        </figure>
        <section class="article__flow">
          <div class="article__flow__item">
            <figure class="article__flow__item__figure">
              <img src="/assets/images/ecosystem/img_01_02.jpg" alt="" appAnimate />
              <figcaption class="article__flow__item__figure__figcaption textbox" appAnimate>
                <p appTypeText>
                  Popo are herbivores with a thick coat to protect against the cold.<br />Generally docile creatures
                  that will run off in a herd if attacked. However, the adult males will boldly counter with their
                  tusks to protect their offspring.
                </p>
              </figcaption>
            </figure>
          </div>
          <div class="article__flow__item">
            <figure class="article__flow__item__figure">
              <img src="/assets/images/ecosystem/img_01_03.jpg" alt="" appAnimate />
              <figcaption class="article__flow__item__figure__figcaption textbox" appAnimate>
                <p appTypeText>
                  Sometimes you'll have to make your way through waist-deep snow. Pick hot peppers to craft hot drinks
                  in order to stave off the cold.
                </p>
              </figcaption>
            </figure>
          </div>
        </section>
      </article>
    </div>

    <header class="content__header" appAnimate>
      <h1 class="content__header__title">An Area Formed by Walls of Ice</h1>
    </header>
    <div class="content__body">
      <article class="article">
        <figure class="article__figure">
          <img src="/assets/images/ecosystem/img_02_01.jpg" alt="" appAnimate />
          <figcaption class="article__figure__text textbox" appAnimate>
            <p appTypeText>
              An area formed by layers of icy walls. <br />The unsure footing and narrow passes will surely make for a
              difficult investigation.
            </p>
          </figcaption>
        </figure>
        <figure class="article__figure article__figure_right">
          <img src="/assets/images/ecosystem/img_02_02.jpg" alt="" appAnimate />
          <figcaption class="article__figure__text textbox" appAnimate>
            <p appTypeText>
              Many undiscovered areas lay in wait in the Hoarfrost Reach, and will need further investigation.
            </p>
          </figcaption>
        </figure>
      </article>
    </div>
  </section>

  <app-btn-already
    small
    title="Go here for more information on previous ecosystems."
    href="http://monsterhunterworld.com/us/ecosystem/01.php"
  ></app-btn-already>
</div>
